server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name _;

  # 内置自签证书（第一次部署即用；如需真实证书，可在服务器上替换/挂载）
  ssl_certificate     /etc/nginx/certs/self-signed.crt;
  ssl_certificate_key /etc/nginx/certs/self-signed.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # ========= 静态站点：前台（SPA） =========
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # ========= 管理端（部署到 /admin 子路径） =========
  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
  }

  # ========= API：管理端 axios baseURL = /api =========
  # 去掉 /api 前缀，转发为后端真实路径（例如 /api/admin/login -> /admin/login）
  location /api/ {
    proxy_pass http://ayeezblog-backend:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ========= 公共文章 API（前台） =========
  location /post/ {
    proxy_pass http://ayeezblog-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

