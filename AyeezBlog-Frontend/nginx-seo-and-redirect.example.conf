# =====================================================================
# 生产 Nginx 配置参考模板：
# 1. ayeez.cn（含 www）保留路径 301 重定向至 blog.ayeez.cn，并根域直出 /ads.txt
# 2. blog.ayeez.cn 放行 /sitemap.xml（反代至后端）、/robots.txt、/ads.txt
#
# 使用方式：参考合并到服务器 Docker volume `config` 中的实际 Nginx 配置后执行：
#   docker exec nginx nginx -t && docker exec nginx nginx -s reload
# =====================================================================

# --- 1) 根域名 ayeez.cn（HTTP -> HTTPS 博客） ---
server {
    listen 80;
    server_name ayeez.cn www.ayeez.cn;
    return 301 https://blog.ayeez.cn$request_uri;
}

# --- 2) 根域名 ayeez.cn（HTTPS 保留路径 301 -> blog.ayeez.cn，直出 ads.txt） ---
server {
    listen 443 ssl;
    server_name ayeez.cn www.ayeez.cn;

    # 替换为服务器上 ayeez.cn 的真实证书路径
    # ssl_certificate     /etc/nginx/certs/ayeez.cn.pem;
    # ssl_certificate_key /etc/nginx/certs/ayeez.cn.key;

    # 根域直出 ads.txt，避免任何重定向链路校验风险
    location = /ads.txt {
        default_type text/plain;
        return 200 "google.com, pub-7074159807555116, DIRECT, f08c47fec0942fa0\n";
    }

    # 其余所有路径保留 URI 做 301 永久重定向至 blog.ayeez.cn
    location / {
        return 301 https://blog.ayeez.cn$request_uri;
    }
}

