name: 部署前端 (Legacy Manual Only)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: production-frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: AyeezBlog-Frontend/package-lock.json

      - name: 安装依赖
        working-directory: ./AyeezBlog-Frontend
        run: npm ci

      - name: 构建项目
        working-directory: ./AyeezBlog-Frontend
        run: npm run build

      - name: 部署到服务器（rsync）
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: bash .github/scripts/deploy-frontend.sh
