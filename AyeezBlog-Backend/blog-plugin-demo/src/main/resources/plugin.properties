# 外部插件 jar 元信息（打包后位于 jar 根路径；后端 ExternalPluginDescriptorReader 仅识别此文件名）。
# 自动加载分页插件时据此读取 plugin.id / plugin.class / plugin.version，无需再手写主类全名。
#
# 默认入口：带心跳与状态的 StatefulSideEffectPageSizeRulePlugin，供 Level2 压测 / A/B 泄露对照（pluginCleanupEnabled）。
# 纯双倍、无心跳：同一构建会额外产出 blog-plugin-demo-0.0.1-SNAPSHOT-double.jar（double 版 plugin.properties 由 pom 内 antrun 写入），拷入监听目录即可。
plugin.id=stateful-side-effect-page-size-rule
plugin.class=cn.ayeez.blogplugindemo.paging.StatefulSideEffectPageSizeRulePlugin
plugin.version=1.0.0-stateful
