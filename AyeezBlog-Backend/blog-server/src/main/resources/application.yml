#
# =========================
# 本地开发 / 部署配置说明
# =========================
#
# 1) 数据库（必填）
# - 本项目 datasource 使用 hm.db.* 进行占位符注入；hm.db.username / hm.db.password 没有默认值，
#   不配置会启动失败（典型报错：Could not resolve placeholder 'hm.db.username'）。
# - 可选：hm.db.port 默认 3306（见 spring.datasource.url 的 :${hm.db.port:3306}）。
#
# 2) 环境变量（可选）
# - 你可以选择“直接改本文件里的 hm.db.* / hm.deepseek.* / hm.volcengine.* / hm.qiniu.*”
#   或者通过环境变量注入（见 application-dev.yml）。
# - 注意：application-dev.yml 的数据库用户名变量名是 HM_DB_USER（不是 HM_DB_USERNAME）。
#
#   Windows PowerShell 示例：
#   $env:HM_DB_HOST="localhost"
#   $env:HM_DB_USER="root"
#   $env:HM_DB_PASSWORD="your_password"
#
# 3) 七牛（按需）
# - 管理端“获取上传 token（/admin/upload/qiniu/token）”与“AI 生成封面后转存七牛”需要 qiniu.* 配置齐全；
#   仅跑文章/分类/标签等基础接口可不配。
# - 这里的 qiniu.* 实际读取自 qiniu.*（见 QiniuProperties prefix="qiniu"），但为了兼容环境变量注入，
#   本文件把 qiniu.* 的值写成从 hm.qiniu.* 取（hm.qiniu.* 通常由 application-dev.yml 从环境变量注入）。
#
# 4) AI（按需）
# - 简介生成：配置 hm.deepseek.api-key，启用 hm.deepseek.summary-enabled=true
# - 封面生成：配置 hm.volcengine.access-key / hm.volcengine.secret-key，启用 hm.volcengine.cover-enabled=true
#   并确保七牛可用（因为生成的图片会转存到七牛后返回 URL）
#
# =========================
# Spring / Datasource
# =========================
spring:
  application:
    name: blog-server
  config:
    import: optional:classpath:application-local-secret.yml
  #数据库的链接信息
  datasource:
    # useUnicode/characterEncoding：避免 Docker/Windows 下 JDBC 默认会话字符集导致中文标题等乱码
    # connectionCollation：会话排序规则与表 utf8mb4_unicode_ci 一致，减少 JDBC 默认 latin1 会话导致的中文乱码
    url: jdbc:mysql://${hm.db.host}:${hm.db.port:3306}/ayeezblog?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${hm.db.username}
    password: ${hm.db.password}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
    # RabbitMQ 配置
  rabbitmq:
    host: ${hm.rabbitmq.host:localhost}
    port: ${hm.rabbitmq.port:5672}
    username: ${hm.rabbitmq.username:guest}
    password: ${hm.rabbitmq.password:guest}
    virtual-host: ${hm.rabbitmq.virtual-host:/}
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 3
        max-concurrency: 10
        prefetch: 50
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        max-interval: 10000
        multiplier: 2.0
  # =========================
  # DeepSeek（OpenAI 兼容 API）
  # =========================
  # - spring.ai.openai.api-key 默认绑定 hm.deepseek.api-key（空则不请求模型）
  # - 简介功能开关在 blog.ai.summary.enabled（默认引用 hm.deepseek.summary-enabled）
  ai:
    openai:
      # spring-ai 1.0.0 在启动时会校验 api-key 非空；默认给占位值，真实调用仍由 blog.ai.summary.enabled 控制
      api-key: ${hm.deepseek.api-key:disabled}
      base-url: https://api.deepseek.com
      chat:
        api-key: ${hm.deepseek.api-key:disabled}
        options:
          model: deepseek-chat
          temperature: 0.3

#mybatis的相关配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #开启驼峰命名映射
    map-underscore-to-camel-case: true
  # 添加Mapper位置配置
  mapper-locations: classpath*:cn/**/mapper/*.xml,classpath*:mapper/*.xml
  type-aliases-package: cn.ayeez.blogpojo.entity

# PageHelper分页配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: pageNum=pageNum;pageSize=pageSize;

# 服务器端口配置
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# AI：封面/简介在 INFO 输出 [AI-COVER] / [AI-SUMMARY]（需 blog.ai.*.verbose-* 为 true）；包级 DEBUG 保留其它调试行
logging:
  level:
    cn.ayeez.blogserver.service.ai: DEBUG
    cn.ayeez.blogserver.controller.admin.AdminAiController: DEBUG

# =========================
# Aliyun OSS（当前项目代码中未见使用点，如后续使用再按需配置）
# =========================
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: javaweb-ayeez
    region: cn-beijing

# =========================
# 七牛云图床（按需）
# =========================
# 需要场景：
# - 管理端直传：GET /admin/upload/qiniu/token
# - AI 封面：生成图片后转存七牛
#
# 配置项说明：
# - qiniu.domain：外链域名（最终拼接成公开访问 URL，建议不带末尾 /）
# - qiniu.uploadUrl：上传入口（按七牛空间所在区域选择）
qiniu:
  accessKey: ${hm.qiniu.access-key:}
  secretKey: ${hm.qiniu.secret-key:}
  bucket: ${hm.qiniu.bucket:}
  # 外链域名（例如：https://img.example.com 或 https://xxx.qiniucdn.com）
  domain: ${hm.qiniu.domain:}
  # 上传入口（默认华东）；如需按区域替换为对应 upload host
  uploadUrl: ${hm.qiniu.upload-url:https://up-z2.qiniup.com}
  # token 有效期（秒）
  tokenExpires: ${hm.qiniu.token-expires:1800}

# =========================
# AI 开关（按需）
# =========================
# - enabled 默认引用 hm.deepseek.summary-enabled / hm.volcengine.cover-enabled
blog:
  ai:
    summary:
      enabled: ${hm.deepseek.summary-enabled:false}
      max-content-chars: 12000
      max-description-length: 240
      # 为 true 时 INFO 打印 DeepSeek 系统/用户提示词与模型原始输出
      verbose-log: ${hm.deepseek.verbose-log:true}
    # 火山引擎即梦：智能视觉 CVProcess（签名鉴权）→ 临时图 URL → 下载后转存七牛
    # 密钥为控制台「访问控制」API 访问密钥（Access Key + Secret），非百炼 sk-。
    cover:
      enabled: ${hm.volcengine.cover-enabled:false}
      access-key: ${hm.volcengine.access-key:}
      secret-key: ${hm.volcengine.secret-key:}
      host: visual.volcengineapi.com
      action: CVProcess
      version: 2022-08-31
      region: cn-north-1
      service: cv
      req-key: jimeng_high_aes_general_v21_L
      width: 1664
      height: 928
      seed: -1
      return-url: true
      max-content-excerpt-chars: 2000
      max-total-prompt-chars: 1200
      max-user-prompt-chars: 300
      # 为 true 时易改写 prompt、偏离固定封面风格，建议 false
      use-pre-llm: ${hm.volcengine.use-pre-llm:false}
      # 为 true 时 INFO 打印即梦完整请求 JSON、URL、响应体（不含 Authorization 明文）
      verbose-http-log: ${hm.volcengine.verbose-http-log:true}
