#TODO部署后要改配置
#配置数据库的连接信息
spring:
  application:
    name: blog-server
  #数据库的链接信息
  datasource:
    url: jdbc:mysql://${hm.db.host}:3306/ayeezblog
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.password}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

#mybatis的相关配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #开启驼峰命名映射
    map-underscore-to-camel-case: true
  # 添加Mapper位置配置
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cn.ayeez.blogpojo.entity

# PageHelper分页配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: pageNum=pageNum;pageSize=pageSize;

# 服务器端口配置
server:
  port: 8080

aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: javaweb-ayeez
    region: cn-beijing

# 七牛云图床（管理端直传需要后端下发 uploadToken）
qiniu:
  accessKey: ${hm.qiniu.access-key:}
  secretKey: ${hm.qiniu.secret-key:}
  bucket: ${hm.qiniu.bucket:}
  # 外链域名（例如：https://img.example.com 或 https://xxx.qiniucdn.com）
  domain: ${hm.qiniu.domain:}
  # 上传入口（默认华东）；如需按区域替换为对应 upload host
  uploadUrl: ${hm.qiniu.upload-url:https://up-z2.qiniup.com}
  # token 有效期（秒）
  tokenExpires: ${hm.qiniu.token-expires:1800}
