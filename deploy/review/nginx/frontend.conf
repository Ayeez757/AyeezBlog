server {
    listen 80;
    server_name _;

    # 静态页与默认响应带上 charset，避免 Windows 浏览器按系统编码（如 GBK）误判导致整站中文乱码
    charset utf-8;
    source_charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    client_max_body_size 100m;

    # 演示 / 排障：后端文章与热重载接口在 /post/*（不经 /api），须显式反代，否则会落到 SPA index.html
    location ^~ /post/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # 保留后端 Content-Type（含 charset），避免 nginx 用 charset 指令错误改写 JSON/HTML
        proxy_pass_header Content-Type;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 与 Vite 开发代理一致：/api → 后端根路径（去掉 /api 前缀）
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_pass_header Content-Type;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 评论 Twikoo：与 vite.config.js 一致（评审机需能访问外网）
    location /twikoo-proxy/ {
        proxy_pass https://twikoo.ayeez.cn/;
        proxy_ssl_server_name on;
        proxy_set_header Host twikoo.ayeez.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }
}
